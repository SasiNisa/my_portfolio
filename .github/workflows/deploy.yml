name: Deploy Portfolio to Bluehost (FTPS)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: FTPS Deploy to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}        # e.g., ftp.zendlean.com
          username: ${{ secrets.FTP_USERNAME }}    # e.g., ci-cd@sasihub.com
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}            # usually 21
          server-dir: /public_html/sasihub.com/        # folder on Bluehost
          protocol: ftps
